[package]
name = "voxl-viewer"
version = "0.1.0"
edition = "2021"
license = "MIT"
build = "build.rs"

[dependencies]
flate2 = "1"
voxl-media = { path = "../media" }
sdl2 = { version = "0.38", features = ["use-pkgconfig"] }
glow = "0.16"
tokio = { version = "1", features = ["rt", "net", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3", features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
log = "0.4"
env_logger = "0.11"
libc = "0.2"
libloading = "0.8"

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1
